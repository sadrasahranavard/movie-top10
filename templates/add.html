<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Add a Movie</h1>
            <p class="subtitle">Expand your collection</p>
        </header>

        <nav class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('add') }}">Add Movie</a>
            <a href="{{ url_for('select') }}">Manage</a>
            <a href="{{ url_for('must_watch') }}" class="special">✦ 50 Must-Watch</a>
        </nav>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST" class="movie-form" enctype="multipart/form-data">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" placeholder="e.g. The Godfather" required>

            <label for="year">Year</label>
            <input type="number" name="year" id="year" min="1888" max="2026" placeholder="e.g. 1972">

            <label for="rating">Rating (0–10)</label>
            <input type="number" name="rating" id="rating" min="0" max="10" step="0.1" placeholder="e.g. 9.2" required>

            <label for="review">Review</label>
            <textarea name="review" id="review" placeholder="What makes this film special to you..."></textarea>

            <label for="poster_url">Poster URL</label>
            <input type="url" name="poster_url" id="poster_url" placeholder="https://example.com/poster.jpg">

            <label for="poster_file">Or Upload Poster Image</label>
            <input type="file" name="poster_file" id="poster_file" accept="image/*">

            <button type="submit" class="btn">Add Movie</button>
        </form>

        <footer class="footer">
            <p>Movie Top 10 &copy; 2026</p>
        </footer>
    </div>
</body>
</html>
